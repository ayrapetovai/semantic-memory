[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-memory"
version = "0.2.0"
description = "Persistent project facts and a hybrid code index for LLM agents (MCP + NDJSON bridge)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "semantic-memory contributors" }]
keywords = ["mcp", "memory", "code-index", "llm", "retrieval"]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
embeddings = ["fastembed>=0.7,<1"]
vec = ["sqlite-vec"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
semantic-memory = "semantic_memory.cli:main"

[tool.setuptools]
packages = ["semantic_memory"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
